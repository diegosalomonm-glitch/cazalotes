      <rect x="0" y="14" width="15" height="4" rx="1"/>
      <rect x="12" y="16" width="3" height="12" rx="1"/>
    </g>
    <!-- jarron -->
    <g transform="translate(60,10) rotate(-10 6 10)">
      <path d="M3,0 h6 v4 Q14,9 12,17 Q10,22 6,22 Q2,22 0,17 Q-2,9 3,4 Z"/>
