<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 100" role="img" aria-label="Cachalote echando cacharros por el chorro">
  <g transform="translate(0,36)">
    <path fill="currentColor" d="M8,24 Q8,14 18,14 L54,14 C70,14 82,19 93,28 L104,34 L117,24 Q122,22 121,27 L111,36 L121,45 Q122,50 117,48 L104,38 C91,45 77,49 60,49 L26,49 Q19,49 17,45 L13,42 Q8,39 8,32 Z"/>
    <path fill="currentColor" d="M48,47 Q52,58 62,58 Q57,53 57,47 Z"/>
    <g fill="none" stroke="var(--hueco,#eceae4)" stroke-width="1.6" stroke-linecap="round">
